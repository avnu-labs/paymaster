name: Deploy release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_KEY }}
      - name: Determine if stable release
        id: check_stable
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push paymaster distroless service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/paymaster.dockerfile
          push: true
          target: distroless
          tags: |
            avnulabs/paymaster:${{ github.ref_name }}
            ${{ steps.check_stable.outputs.is_stable == 'true' && 'avnulabs/paymaster:latest' || '' }}
      - name: Build and push paymaster debian service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/paymaster.dockerfile
          push: true
          target: debian
          tags: |
            avnulabs/paymaster:${{ github.ref_name }}-debian
            ${{ steps.check_stable.outputs.is_stable == 'true' && 'avnulabs/paymaster:latest-debian' || '' }}
      - name: Build and push paymaster CLI distroless image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/cli.dockerfile
          push: true
          target: distroless
          tags: |
            avnulabs/paymaster-cli:${{ github.ref_name }}
            ${{ steps.check_stable.outputs.is_stable == 'true' && 'avnulabs/paymaster-cli:latest' || '' }}
      - name: Build and push CLI debian image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/cli.dockerfile
          push: true
          target: debian
          tags: |
            avnulabs/paymaster-cli:${{ github.ref_name }}-debian
            ${{ steps.check_stable.outputs.is_stable == 'true' && 'avnulabs/paymaster-cli:latest-debian' || '' }}
